<header class="app-header">
  <a class="wordmark" [routerLink]="ui.link('my-books')" aria-label="App name library"><mat-icon>auto_stories</mat-icon><span>analyzer.</span></a>
  <nav aria-label="Main navigation">
    <a [routerLink]="ui.link('my-books')" routerLinkActive="active">My library</a>
    <a [routerLink]="ui.link('all-books')" routerLinkActive="active">Explore</a>
    <a [routerLink]="ui.link('notes')" routerLinkActive="active">Notebook</a>
  </nav>
  <div class="header-end">
    <a class="icon-button" [routerLink]="ui.link('account')" aria-label="Open your account" matTooltip="Your account"><mat-icon>person_outline</mat-icon></a>
    <button class="icon-button" (click)="logout()" routerLink="/login" aria-label="Sign out" matTooltip="Sign out">
      <mat-icon>logout</mat-icon>
    </button>
  </div>
</header>
