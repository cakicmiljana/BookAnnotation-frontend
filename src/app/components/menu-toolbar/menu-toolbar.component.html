<header class="app-header">
  <a class="wordmark" [routerLink]="ui.link('my-books')" aria-label="Marginalia library"><mat-icon>auto_stories</mat-icon><span>marginalia<span class="wordmark-dot">.</span></span></a>
  <nav aria-label="Main navigation">
    <a [routerLink]="ui.link('my-books')" routerLinkActive="active">My library</a>
    <a [routerLink]="ui.link('all-books')" routerLinkActive="active">Explore</a>
    <a [routerLink]="ui.link('notes')" routerLinkActive="active">Notebook</a>
  </nav>
  <div class="header-end">
    <span *ngIf="ui.preview" class="preview-label"><span class="preview-dot"></span>UI preview</span><a class="avatar" [routerLink]="ui.link('account')" aria-label="Open your account"><mat-icon>person_outline</mat-icon></a><a *ngIf="ui.preview" class="exit-preview" routerLink="/login" aria-label="Exit preview" matTooltip="Exit preview"><mat-icon>logout</mat-icon></a>
    <button *ngIf="!ui.preview" class="icon-button" (click)="logout()" routerLink="/login" aria-label="Sign out" matTooltip="Sign out">
      <mat-icon>logout</mat-icon>
    </button>
  </div>
</header>
