<section class="dialog-content">
  <header class="dialog-heading">
    <div>
      <span class="eyebrow">Return to a thought</span>
      <h2>
        Edit annotation
      </h2>
    </div>
    <button class="icon-button" mat-dialog-close aria-label="Close annotation">
      <mat-icon>close</mat-icon>
    </button>
  </header>
  <blockquote *ngIf="data.text" class="quote">
    {{ data.text }}
  </blockquote>
  <app-annotation-fields [(color)]="color" [(tag)]="tag" [(comment)]="comment">
  </app-annotation-fields>
  <p *ngIf="saved" class="status" role="status">
    Changes submitted to the mock service. Persistence is not connected.
  </p>
  <div *ngIf="confirmDelete" class="status">
    <p>
      Remove this annotation?
    </p>
    <div class="actions">
      <button class="button quiet" (click)="confirmDelete = false">
        Cancel
      </button>
      <button class="button danger" (click)="deleteAnnotation()" mat-dialog-close>
        Remove annotation
      </button>
    </div>
  </div>
  <footer class="dialog-footer spread">
    <button class="button quiet danger" (click)="confirmDelete = true">
      <mat-icon>delete_outline</mat-icon>Remove
    </button>
    <div class="actions">
      <button class="button quiet" mat-dialog-close>
        Cancel
      </button>
      <button class="button primary" (click)="updateAnnotation(); saved = true">
        Update annotation
      </button>
    </div>
  </footer>
</section>
