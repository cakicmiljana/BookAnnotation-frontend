<div class="annotation-container">
  <h3 class="annotation-title">Update Annotation</h3>

  <!-- <mat-form-field appearance="outline" class="form-field">
    <mat-label>Comment</mat-label>
    <input matInput type="text" [(ngModel)]="comment" placeholder="Edit your comment">
  </mat-form-field> -->
  <mat-form-field appearance="outline" class="form-field">
  <mat-label>Comment</mat-label>
  <textarea
    matInput
    [(ngModel)]="comment"
    placeholder="Write your comment"
    rows="4"
    cdkTextareaAutosize
    #autosize="cdkTextareaAutosize"
    cdkAutosizeMinRows="2"
    cdkAutosizeMaxRows="6">
  </textarea>
</mat-form-field>

  <mat-form-field appearance="outline" class="form-field">
    <mat-label>Tag</mat-label>
    <mat-select [(value)]="tag">
      <mat-option value="">None</mat-option>
      <mat-option value="important">Important</mat-option>
      <mat-option value="analysis">Analysis</mat-option>
      <mat-option value="quote">Quote</mat-option>
      <mat-option value="definition">Definition</mat-option>
      <mat-option value="question">Question</mat-option>
      <mat-option value="symbolism">Symbolism</mat-option>
      <mat-option value="motif">Motif</mat-option>
      <mat-option value="criticism">Criticism</mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline" class="form-field">
    <mat-label>Color</mat-label>
    <mat-select [(value)]="color">
      <mat-option value="lightblue">Blue</mat-option>
      <mat-option value="lightcoral">Red</mat-option>
      <mat-option value="darkseagreen">Green</mat-option>
      <mat-option value="lightpink">Pink</mat-option>
      <mat-option value="lightyellow">Yellow</mat-option>
    </mat-select>
  </mat-form-field>

  <div class="action-buttons">
    <button mat-raised-button class="update-button" (click)="updateAnnotation()">
      <mat-icon>post_add</mat-icon>
      Update
    </button>
    <button mat-raised-button class="delete-button" (click)="deleteAnnotation()">
      <mat-icon>delete_outline</mat-icon>
      Delete
    </button>
  </div>
</div>
