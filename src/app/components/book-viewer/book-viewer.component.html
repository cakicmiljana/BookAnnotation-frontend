<div class="book-details">
    <div class="book-item">
        <div>
            <div>
                <h2 class="title">
                    {{book?.title}}
                </h2>
                <div class="details">
                    <div class="details-item">
                        <h3>
                            {{book?.author}}
                        </h3>
                        <h4>
                            {{book?.pages}} pages
                        </h4>
                        <h4>
                            {{book?.country}}, {{book?.publicationYear}}.
                        </h4>
                    </div>
                </div>
                </div>
        </div>
    </div>
    <div class="plot">
        <h2>
            PLOT
        </h2>
        <p class="dark-content">
            {{ book?.description || 'No plot available' }}
        </p>
    </div>
    <div class="versions">
        <h2>
            EDITIONS
        </h2>
        <div class="versions-list">
            <ul *ngFor="let version of versions">
                <app-version-preview [version]="version"></app-version-preview>
            </ul>
        </div>
    </div>
</div>
