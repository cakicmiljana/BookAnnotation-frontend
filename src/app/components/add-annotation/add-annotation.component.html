<section class="dialog-content">
  <header class="dialog-heading">
    <div>
      <span class="eyebrow">A thought worth keeping</span>
      <h2>
        New annotation
      </h2>
    </div>
    <button class="icon-button" mat-dialog-close aria-label="Close annotation">
      <mat-icon>close</mat-icon>
    </button>
  </header>
  <blockquote class="quote">
    {{ data.text }}
  </blockquote>
  <app-annotation-fields [(color)]="color" [(tag)]="tag" [(comment)]="comment">
  </app-annotation-fields>
  <p class="preview-label">
    This edition uses the existing mock annotation service.
  </p>
  <footer class="dialog-footer">
    <button class="button quiet" (click)="onSubmit()">
      Cancel
    </button>
    <button class="button primary" (click)="addAnnotation()">
      <mat-icon>border_color</mat-icon>Add annotation
    </button>
  </footer>
</section>
