<mat-card class="card" appearance="outlined">
    <mat-card-header>
        <mat-card-title>
            <!-- <h2>
                {{version?.book?.title}}
            </h2>
            <h3>
                {{version?.book?.author}}
            </h3> -->
            <div>
                <h2 class="title">
                    {{version?.book?.title}}
                </h2>
                <div class="details">
                    <div class="details-item">
                        <h3>
                            {{version?.book?.author}}
                        </h3>
                        <h4>
                            {{version?.book?.pages}} pages
                        </h4>
                        <h4>
                            {{version?.book?.country}}, {{version?.book?.publicationYear}}.
                        </h4>
                    </div>
                </div>
                </div>
        </mat-card-title>
    </mat-card-header>
    <mat-card-content>
        <p>
            {{version?.content || 'No content available.'}}
        </p>
    </mat-card-content>
    <mat-card-footer>
        
    </mat-card-footer>
</mat-card>
