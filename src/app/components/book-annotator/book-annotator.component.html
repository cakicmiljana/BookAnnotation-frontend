<mat-drawer-container class="note-container" autosize>

  <mat-drawer #drawer mode="over" position="start" class="note-drawer">
    <div class="note-header">
      <h3>My Notes</h3>
    </div>

    <form class="note-form">
      <mat-form-field appearance="outline" class="note-textarea">
        <textarea 
          matInput 
          [(ngModel)]="noteContent" 
          name="noteContent"
          placeholder="Write your note here...">
        </textarea>
      </mat-form-field>

      <button mat-raised-button class="note-button" (click)="saveNote()">
        <mat-icon>edit_note</mat-icon>
        Save
      </button>
    </form>
  </mat-drawer>

  <mat-drawer-content>
    <button mat-fab class="side-button" (click)="drawer.toggle()" matTooltip="Toggle Notes">
      <mat-icon>sticky_note_2</mat-icon>
    </button>

    <mat-card class="reader-card">
      <mat-card-header>
        <mat-card-title>
          <div class="book-header">
            <h2>{{ book?.title }}</h2>
            <div class="book-details">
              <span>{{ book?.author }}</span>
              <span>{{ book?.pages }} pages</span>
              <span>{{ book?.country }}, {{ book?.publicationYear }}</span>
            </div>
          </div>
        </mat-card-title>
      </mat-card-header>

      <mat-card-content>
        <div class="book-content" 
             [innerHTML]="annotatedText" 
             (mouseup)="annotateText($event)" 
             (click)="updateAnnotation($event)">
        </div>

        <mat-paginator
          [length]="fullContent.length"
          [pageSize]="pageSize"
          [pageIndex]="currentPage"
          aria-label="Select page"
          (page)="getPageData($event)">
        </mat-paginator>

        <div class="page-info">
          Page {{ currentPage + 1 }} of {{ totalPages }}
        </div>
      </mat-card-content>
    </mat-card>
  </mat-drawer-content>

</mat-drawer-container>
