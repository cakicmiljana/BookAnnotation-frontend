<mat-card class="card" appearance="outlined">
  <mat-card-header>
    <mat-card-title>
      <div>
        <h2 class="title">{{ version?.book?.title }}</h2>
        <div class="details">
          <div class="details-item">
            <h3>{{ version?.book?.author }}</h3>
            <h5>{{ version?.book?.pages }} pages</h5>
            <h5>{{ version?.book?.country }}, {{ version?.book?.publicationYear }}.</h5>
          </div>
        </div>
      </div>
    </mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <div class="book-content" [innerHTML]="annotatedText" (mouseup)="annotateText($event)"></div>

    <mat-paginator
      [length]="totalPages"
      [pageSize]="pageSize"
      [pageIndex]="currentPage"
      aria-label="Select page"
      (page)="getPageData($event)">
    </mat-paginator>
  </mat-card-content>
</mat-card>
