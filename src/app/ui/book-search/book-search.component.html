<div class="find-bar" role="search" aria-label="Find text in this book">
  <label class="find-input">
    <mat-icon>search</mat-icon>
    <span class="sr-only">Find a word or phrase in this book</span>
    <input #findInput [ngModel]="query" (ngModelChange)="query = $event; search()" placeholder="Find in this book…" autocomplete="off"
      (keydown)="onKeydown($event)">
  </label>
  <span class="match-count" role="status" aria-live="polite">{{ matches.length ? (activeIndex + 1) + ' of ' + matches.length : query.trim() ? 'No matches' : 'Find text' }}</span>
  <div class="find-actions">
    <button type="button" class="icon-button" [disabled]="!matches.length" (click)="moveMatch(-1)" aria-label="Previous match" matTooltip="Previous match (Shift+Enter)"><mat-icon>keyboard_arrow_up</mat-icon></button>
    <button type="button" class="icon-button" [disabled]="!matches.length" (click)="moveMatch(1)" aria-label="Next match" matTooltip="Next match (Enter)"><mat-icon>keyboard_arrow_down</mat-icon></button>
    <button type="button" class="icon-button" (click)="closed.emit()" aria-label="Close text search" matTooltip="Close (Escape)"><mat-icon>close</mat-icon></button>
  </div>
</div>
